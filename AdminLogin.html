<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - VanderBuild</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='VanderBuild_Logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(16, 22, 20, 0.75), rgba(16, 22, 20, 0.75)),
                        url("{{ url_for('static', filename='bglogin.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .block-skeleton {
            background: #e2e8f0; 
            background: linear-gradient(110deg, #e2e8f0 8%, #cbd5e0 18%, #e2e8f0 33%);
            background-size: 200% 100%;
            animation: construct-shimmer 1.5s infinite linear;
            border: 1px solid #cbd5e0; 
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            height: 420px;
            width: 420px;
        }

        @keyframes construct-shimmer {
            to { background-position-x: -200%; }
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(10px);          
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #1d1d1d;
        }

        .form-control {
            border-radius: 12px;
            padding-left: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #d1d5db;
        }

        .input-group-text {
            background: transparent;
            border: none;
            position: absolute;
            z-index: 10;
            height: 45px;
            display: flex;
            align-items: center;
            padding-left: 15px;
            color: #6b7280;
        }

        .input-wrapper { position: relative; margin-bottom: 20px; }

        .btn-login {
            background: #006F53;
            color: white;
            border-radius: 12px;
            height: 45px;
            font-weight: 500;
            transition: 0.3s;
            border: none;
        }

        .btn-login:hover { background: #004d3a; color: white; }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loader" class="block-skeleton"></div>

    <div id="login-content" class="login-card text-center" style="display: none;">
        <h1 style="font-family: serif; font-weight: bold; display:flex; align-items:center; justify-content:center;">
            <img src="{{ url_for('static', filename='VanderBuild_Logo.png') }}" style="height: 60px; margin-right: -14px;">
            <span style="color:#006F53;">ander</span>
            <span style="color:#800000;">Build</span>
        </h1>
        <h6 style="font-family: serif;"><b>RE HOLDING CORP.</b></h6>
        <p style="font-family: serif; color: gray; font-size: 0.8rem; margin-bottom: 20px;">ADMIN PORTAL</p>

        <form action="/login" method="POST" id="loginForm">
            <input type="hidden" name="user_type" value="admin">
            <div class="input-wrapper">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="input-wrapper">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </span>
            </div>
            <button type="submit" class="btn btn-login w-100" id="loginBtn">
                <span id="btnText">Log In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </form>

        <div class="mt-3" style="font-size: 0.9rem;">
            <a href="{{ url_for('employee_home') }}" style="color: #1d1d1d; text-decoration: none; font-weight: 600;">
                Press for Employee Login
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                const content = document.getElementById('login-content');
                content.style.display = 'block';
                content.classList.add('animate__animated', 'animate__zoomIn');
            }, 1200); 
        });

        function togglePassword() {
            const passwordField = document.getElementById("password");
            const toggleIcon = document.getElementById("toggleIcon");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                passwordField.type = "password";
                toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        document.getElementById('loginForm').onsubmit = function() {
            document.getElementById('btnText').innerText = "Authenticating...";
            document.getElementById('btnSpinner').classList.remove('d-none');
            document.getElementById('loginBtn').disabled = true;
        };
    </script>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    let iconType = 'error';
                    let titleText = 'Access Denied';

                    if ("{{ category }}" === "success" || "{{ category }}" === "info") {
                        iconType = 'success';
                        titleText = 'Logged Out';
                    } else if ("{{ category }}" === "warning") {
                        iconType = 'warning';
                        titleText = 'System Note';
                    }

                    Swal.fire({
                        icon: iconType,
                        title: titleText,
                        text: "{{ message }}",
                        showConfirmButton: false,
                        timer: 3000,
                        showClass: { popup: 'animate__animated animate__fadeInDown' },
                        hideClass: { popup: 'animate__animated animate__fadeOutUp' }
                    });
                });
            </script>
        {% endfor %}
    {% endif %}
{% endwith %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
