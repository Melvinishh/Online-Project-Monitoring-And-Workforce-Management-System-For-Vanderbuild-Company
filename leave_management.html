<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management - Vanderbuild</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --vander-green: #004d40;
            --vander-mint: #00897b;
            --vander-bg: #f4f6f9;
        }

        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--vander-bg); 
            overflow-x: hidden; 
            margin: 0;
        }
        
        /* Sidebar - Flexbox layout to pin Logout to bottom */
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            background: var(--vander-green);
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            animation: slideInLeft 0.6s ease-out forwards;
            z-index: 1000;
        }

        @keyframes slideInLeft { 
            from { opacity: 0; transform: translateX(-100%); } 
            to { opacity: 1; transform: translateX(0); } 
        }

        .sidebar h5 { 
            font-weight: 600; 
            margin-bottom: 30px; 
            letter-spacing: 1px;
            padding-left: 15px;
        }

        .sidebar a { 
            display: block; 
            color: #cbd5e1; 
            padding: 12px 15px; 
            text-decoration: none; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            transition: 0.3s; 
            font-size: 0.95rem;
        }

        .sidebar a:hover, .sidebar a.active { 
            background: rgba(255,255,255,0.1); 
            color: white; 
        }

        /* Pushes Logout to the bottom like in the profile/payroll designs */
        .logout-link {
            margin-top: auto;
            margin-bottom: 20px;
        }

        /* Main Content */
        .main-content { 
            margin-left: 260px; 
            padding: 30px; 
            animation: fadeIn 0.8s ease-in; 
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Premium Green Gradient Banner - Matching Payroll Top Style */
        .top-banner {
            background: linear-gradient(to right, var(--vander-green), var(--vander-mint));
            color: white; 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 77, 64, 0.2);
            animation: slideDown 0.6s ease-out forwards;
        }

        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-50px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Form Card - Matching Payroll Payslip Card Depth */
        .form-card { 
            background: white; 
            border-radius: 15px; 
            padding: 45px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            max-width: 850px; 
            margin: 0 auto;
            border-top: 5px solid var(--vander-mint);
        }

        .form-label {
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 8px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--vander-mint);
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.1);
            outline: none;
        }

        /* Primary Action Buttons */
        .btn-submit { 
            background: var(--vander-green); 
            color: white; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: 0.3s; 
        }

        .btn-submit:hover { 
            background: var(--vander-mint); 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 137, 123, 0.3);
            color: white;
        }

        .btn-cancel {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            padding: 14px 20px;
            transition: 0.3s;
        }

        .btn-cancel:hover { color: #1e293b; }

        /* Custom Section Title (Matching Payroll section style) */
        .section-header {
            color: var(--vander-green);
            font-weight: 700;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h5>Vanderbuild Company</h5>
    <a href="{{ url_for('employee_dashboard') }}"><i class="fas fa-th-large me-2"></i>Dashboard</a>
    <a href="#"><i class="fas fa-history me-2"></i>Attendance History</a>
    <a href="#"><i class="fas fa-calendar-alt me-2"></i>Calendar</a>
    <a href="{{ url_for('leave_management') }}" class="active"><i class="fas fa-file-alt me-2"></i>File Leave/OT</a>
    <a href="{{ url_for('mypayroll') }}"><i class="fas fa-wallet me-2"></i>My Payroll</a>
    <a href="{{ url_for('myprofile') }}"><i class="fas fa-user-circle me-2"></i>My Profile</a>
    
    <a href="{{ url_for('logout') }}" class="logout-link">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
    </a>
</div>

<div class="main-content">
    <div class="top-banner">
        <h4 class="mb-1 fw-bold">Leave Management</h4>
        <small class="opacity-75">Submit and track your leave applications</small>
    </div>

    <div class="form-card">
        <div class="text-center mb-5">
            <h3 class="section-header">Request for Leave</h3>
            <p class="text-muted small">Fill out the form below to submit your request for approval.</p>
        </div>
        
        <form action="{{ url_for('leave_management') }}" method="POST">
            <div class="row mb-4">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Leave Type</label>
                    <select class="form-select" name="leave_type" style="border-left: 5px solid var(--vander-mint);">
                        <option value="Vacation">Vacation Leave (Personal/Rest)</option>
                        <option value="Sick">Sick Leave (Medical/Health)</option>
                        <option value="Emergency">Emergency Leave</option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Start Date</label>
                    <input type="date" class="form-control" name="start_date" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">End Date</label>
                    <input type="date" class="form-control" name="end_date" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Reason for Leave</label>
                <textarea class="form-control" name="reason" rows="4" placeholder="Briefly describe the purpose of your leave..." required></textarea>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-paper-plane me-2"></i>Submit Application
                </button>
                <br>
                <a href="{{ url_for('employee_dashboard') }}" class="btn-cancel d-inline-block mt-2">Cancel and Return</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
